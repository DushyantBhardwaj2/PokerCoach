services:
  - type: web
    name: poker-coach-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-base-en-v1.5')"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: postgresql+psycopg2://neondb_owner:npg_V7CIFJgmN1GQ@ep-fragrant-lake-aep3wcv4-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LOCAL_EMBEDDING_MODEL
        value: BAAI/bge-base-en-v1.5
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
